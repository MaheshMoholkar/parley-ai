name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: parley
          POSTGRES_PASSWORD: parley
          POSTGRES_DB: parley_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U parley"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PARLEY_DATABASE_URL: postgresql+psycopg://parley:parley@localhost:5432/parley_test
      PARLEY_TEST_DATABASE_URL: postgresql+psycopg://parley:parley@localhost:5432/parley_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --locked
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy
      - name: Architecture rules
        run: uv run lint-imports
      - name: Boundary check
        run: scripts/check_boundary.sh
      - name: Migrations match the models
        run: uv run alembic upgrade head && uv run alembic check
      - name: Tests
        run: uv run pytest
