# Local development: Postgres, a one-off migration, the API and the worker.
#   docker compose up --build
# Put CSV files in ./data; containers see them under /data.
# With traces, viewed in Jaeger at http://localhost:16686:
#   PARLEY_TRACING=otlp docker compose --profile tracing up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: parley
      POSTGRES_PASSWORD: parley
      POSTGRES_DB: parley
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parley"]
      interval: 2s
      retries: 20

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: &app-env
      PARLEY_DATABASE_URL: postgresql+psycopg://parley:parley@db:5432/parley
      PARLEY_TRACING: ${PARLEY_TRACING:-off}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      db: { condition: service_healthy }

  api:
    build: .
    environment: *app-env
    ports: ["8000:8000"]
    volumes: ["./data:/data:ro"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    build: .
    command: ["parley", "worker"]
    environment: *app-env
    volumes: ["./data:/data:ro"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  # Receives traces over OTLP and shows them. Only with --profile tracing.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    profiles: ["tracing"]
    ports: ["16686:16686"]

volumes:
  pgdata:
